[project]
name = "ai-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Adrian Saul Polanco Ferrer", email = "apolanco@evopoint.io" }
]
requires-python = ">=3.13"
dependencies = [
    "faiss-cpu==1.14.3",
    "numpy==2.5.1",
    "python-dotenv==1.2.2",
    "qdrant-client==1.18.0",
    "rich>=14.0,<15.0",
    "sentence-transformers==5.6.1",
    "structlog==26.1.0",
    "transformers==5.14.1",
]

[project.scripts]
ai-rag = "ai_rag:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pyright]
include = ["src", "labs"]
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
